<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="mini-gitlab-bot">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0b1020"/>
      <stop offset="55%" stop-color="#111a2e"/>
      <stop offset="100%" stop-color="#1a1030"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7aa2f7"/>
      <stop offset="100%" stop-color="#a78bfa"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <circle cx="120" cy="40" r="180" fill="#7aa2f7" opacity="0.10"/>
  <circle cx="1080" cy="300" r="200" fill="#a78bfa" opacity="0.10"/>

  <!-- 机器人标记 -->
  <g transform="translate(78, 92)">
    <rect x="0" y="0" width="64" height="64" rx="16" fill="url(#accent)" opacity="0.95"/>
    <circle cx="22" cy="26" r="5.5" fill="#0b1020"/>
    <circle cx="42" cy="26" r="5.5" fill="#0b1020"/>
    <rect x="20" y="40" width="24" height="5" rx="2.5" fill="#0b1020"/>
    <rect x="28" y="-10" width="8" height="12" rx="4" fill="url(#accent)"/>
    <circle cx="32" cy="-13" r="5" fill="#a78bfa"/>
  </g>

  <!-- 标题 -->
  <text x="168" y="128" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, sans-serif"
        font-size="56" font-weight="700" fill="#f8fafc" letter-spacing="-1.5">mini-gitlab-bot</text>

  <!-- 副标题：ai-fix 用行内 tspan，避免胶囊挡住文字 -->
  <text x="170" y="176" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, sans-serif"
        font-size="19" fill="#9fb0c9">打上&#160;<tspan font-family="ui-monospace, Menlo, Consolas, monospace"
        font-size="18" font-weight="700" fill="#8be9fd">ai-fix</tspan>&#160;标签
        <tspan fill="#5f6f8a">→</tspan> 机器人自动修复并开 draft MR</text>

  <!-- 四个技术胶囊：文字居中，宽度按内容留足 -->
  <g font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, sans-serif" font-size="15"
     text-anchor="middle">
    <rect x="168" y="210" width="116" height="36" rx="18" fill="#0f172a" stroke="#2f3d5c"/>
    <text x="226" y="233" fill="#cbd5e1">Codex CLI</text>

    <rect x="296" y="210" width="129" height="36" rx="18" fill="#0f172a" stroke="#2f3d5c"/>
    <text x="360.5" y="233" fill="#cbd5e1">Python 网关</text>

    <rect x="437" y="210" width="125" height="36" rx="18" fill="#0f172a" stroke="#2f3d5c"/>
    <text x="499.5" y="233" fill="#cbd5e1">MCP · 11 工具</text>

    <rect x="574" y="210" width="137" height="36" rx="18" fill="#0f172a" stroke="#2f3d5c"/>
    <text x="642.5" y="233" fill="#cbd5e1">零凭据 · 零网络</text>
  </g>

  <!-- 右侧流水线示意 -->
  <g transform="translate(800, 84)" font-family="-apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, &quot;PingFang SC&quot;, &quot;Hiragino Sans GB&quot;, &quot;Microsoft YaHei&quot;, &quot;Noto Sans CJK SC&quot;, &quot;Source Han Sans SC&quot;, sans-serif">
    <rect x="0" y="0" width="320" height="176" rx="16" fill="#0d1526" stroke="#27324a"/>
    <text x="20" y="30" font-size="12" fill="#7d8aa5" letter-spacing="1.5">PIPELINE</text>

    <g font-size="14">
      <circle cx="30" cy="58" r="4" fill="#7aa2f7"/><text x="46" y="63" fill="#cbd5e1">preparing</text>
      <circle cx="30" cy="88" r="4" fill="#7aa2f7"/><text x="46" y="93" fill="#cbd5e1">running</text>
      <circle cx="30" cy="118" r="4" fill="#7aa2f7"/><text x="46" y="123" fill="#cbd5e1">validating</text>
      <circle cx="30" cy="148" r="4" fill="#7aa2f7"/><text x="46" y="153" fill="#cbd5e1">pushing</text>

      <circle cx="196" cy="58" r="4" fill="#a78bfa"/><text x="212" y="63" fill="#cbd5e1">opening_mr</text>
      <circle cx="196" cy="88" r="4" fill="#34d399"/><text x="212" y="93" fill="#34d399">succeeded</text>
      <circle cx="196" cy="118" r="4" fill="#f87171"/><text x="212" y="123" fill="#f87171">failed</text>
      <circle cx="196" cy="148" r="4" fill="#fbbf24"/><text x="212" y="153" fill="#fbbf24">requeued</text>
    </g>
  </g>
</svg>
