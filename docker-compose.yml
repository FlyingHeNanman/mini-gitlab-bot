# =============================================================================
# 单容器部署（M5 重写；v0 的 twin-service 版本已删除 —— Renovate 不进本项目）
# =============================================================================
# 使用步骤：
#   1. 复制 .env.example → .env 并填好（至少 WEBHOOK_SECRET / GITLAB_TOKEN /
#      GITLAB_READONLY_TOKEN / REPO_WHITELIST）
#   2. docker compose up -d --build
#   3. docker compose exec bot python -c "import urllib.request as u; print(u.urlopen(
#        'http://127.0.0.1:8080/readyz').read())"
#
# 注意：容器内**不要**再挂宿主机上的 codex 配置或 GitLab token 文件；
# 所有凭据只走环境变量（见 PLAN §7 红线）。
# =============================================================================

services:
  bot:
    build:
      context: .
      args:
        # 想跟进 codex 版本时改这里，同时改 .env 的 CODEX_EXPECTED_VERSION（基线 6）
        CODEX_VERSION: ${CODEX_VERSION:-0.163.0}
    image: mini-gitlab-bot:latest
    # init 让 PID 1 能正确回收孤儿进程（codex / uv / git 都会产生子进程）
    init: true
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # 覆盖 .env 里的默认值：容器内固定用这两个卷
      LOG_DIR: /data/logs
      UV_CACHE_DIR: /work/.uv-cache
      DB_PATH: /data/tasks.db
      WORK_DIR: /work
    ports:
      - "8080:8080"
    volumes:
      - bot-data:/data
      - bot-work:/work
    healthcheck:
      # 就绪探针：数据库可读 + worker 在跑 + 没有卡死的任务
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # 给它时间把在飞任务的租约处理完（超时未完成会在下次启动被 recover 回队列）
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  bot-data:
  bot-work:
