# =============================================================================
# mini-gitlab-bot 单容器部署（默认直接拉镜像，不需要 clone / .env）
# =============================================================================
# 第一次部署：
#   docker compose up -d
#   打开 http://<host>:8080/setup 初始化，保存后按页面提示重启
#
# 想固定版本：MGB_VERSION=0.4.0 docker compose up -d
# 想从源码构建：docker compose -f docker-compose.yml -f docker-compose.dev.yml up -d --build
# =============================================================================

services:
  bot:
    image: ghcr.io/flyinghenanman/mini-gitlab-bot:${MGB_VERSION:-latest}
    container_name: mini-gitlab-bot
    init: true
    restart: unless-stopped
    ports:
      - "${MGB_PORT:-8080}:8080"
    environment:
      PORT: 8080
      CONFIG_FILE: /data/config.json
      DB_PATH: /data/tasks.db
      WORK_DIR: /work
      LOG_DIR: /data/logs
      UV_CACHE_DIR: /work/.uv-cache
      LOG_FORMAT: json
    volumes:
      # 配置、SQLite、日志；首次初始化写入 config.json
      - bot-data:/data
      # job 目录 + uv 缓存
      - bot-work:/work
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import sys,urllib.request; sys.exit(0 if urllib.request.urlopen('http://127.0.0.1:8080/readyz', timeout=3).status == 200 else 1)"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s
    # 给它时间把在飞任务的租约处理完
    stop_grace_period: 60s
    security_opt:
      - no-new-privileges:true
      # codex 的 bubblewrap 需要非特权 user namespace；Docker 默认 seccomp 会拒绝
      - seccomp=unconfined
      - apparmor=unconfined
    cap_drop:
      - ALL
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "5"

volumes:
  bot-data:
  bot-work:
