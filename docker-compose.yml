# ⚠️ v0 遗留文件，**M5 会重写**（PLAN §9）。当前缺陷，请勿直接使用：
#   * TARGET_BRANCH / MAX_ITERATIONS 已删除（目标分支改取项目 default_branch；迭代上限取消）
#   * 缺 M2 需要的 GITLAB_TOKEN 之外的接线：LOG_DIR、UV_CACHE_DIR、CODEX_BIN、GIT_* 等（见 .env.example）
#   * 只挂了 /data 与 /work，没有独立日志卷；bot 与 renovate 的分工也已变更（Renovate 不进本项目）
services:
  bot:
    build: .
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      WEBHOOK_SECRET: ${WEBHOOK_SECRET}
      GITLAB_URL: ${GITLAB_URL}
      GITLAB_TOKEN: ${GITLAB_TOKEN}
      REPO_WHITELIST: ${REPO_WHITELIST:-}
      TARGET_BRANCH: ${TARGET_BRANCH:-main}
      AI_FIX_LABEL: ${AI_FIX_LABEL:-ai-fix}
      MODEL_PROVIDER: ${MODEL_PROVIDER:-internal}
      MODEL_NAME: ${MODEL_NAME:-}
      AGENT_CONCURRENCY: ${AGENT_CONCURRENCY:-2}
      MAX_ITERATIONS: ${MAX_ITERATIONS:-3}
      AGENT_TIMEOUT_SEC: ${AGENT_TIMEOUT_SEC:-1800}
    volumes:
      - bot-data:/data
      - bot-work:/work
    extra_hosts:
      # 内网 GitLab 域名解析；有内网 DNS 时删掉这行
      - "gitlab.example.com:10.0.0.5"

  renovate:
    image: renovate/renovate:latest
    restart: unless-stopped
    environment:
      RENOVATE_PLATFORM: gitlab
      RENOVATE_ENDPOINT: ${GITLAB_URL}/api/v4/
      RENOVATE_TOKEN: ${RENOVATE_TOKEN}
      RENOVATE_AUTODISCOVER: "true"

volumes:
  bot-data:
  bot-work:
