name: release

# 打 tag（vX.Y.Z）触发：先跑测试 → 构建并推送 GHCR → 创建 GitHub Release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write   # 创建 Release
  packages: write   # 推送 ghcr.io

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          version: "0.5.14"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: 发版前跑一遍测试（红线：测试红了不发）
        run: |
          uv python install 3.13
          uv sync --frozen
          uv run ruff check .
          uv run pytest -q

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 镜像标签（v1.2.3 / 1.2 / latest）
        id: meta
        uses: docker/metadata-action@v5
        with:
          # GHCR 要求全小写；仓库名里有大写时不能用 ${{ github.repository }}
          images: ghcr.io/flyinghenanman/mini-gitlab-bot
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            CODEX_VERSION=${{ vars.CODEX_VERSION || '0.157.1' }}
            UV_VERSION=0.5.14
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 创建 GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          generate_release_notes: true
          body: |
            镜像：`ghcr.io/flyinghenanman/mini-gitlab-bot:${{ github.ref_name }}`（同时打 `latest`）

            拉取：

            ```bash
            docker pull ghcr.io/flyinghenanman/mini-gitlab-bot:${{ github.ref_name }}
            ```

            详细变更见仓库根的 `CHANGELOG.md`。
